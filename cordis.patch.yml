# ============================================================================
# dsh-eta-forecast —— DSH bundle patch（挂载声明）
# ============================================================================
# DSH 启动时按 bundle 层栈把各插件 patch 叠起来组成配置树；本文件把
# 「完成时间预测」挂件插入 Web / desktop profile 的配置树。
#
# 安装（不再需要手工改 profile patch）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
#
# ⚠️ 插件行那一行（`id: 值`）绝不能写行尾注释：商城预检用正则抓该行的值，
#    并要求其后直接换行，行尾注释会让整份提交被判 SUBMISSION_ENTRY_MISSING。
# ============================================================================

- insert:
    - id: dsh-eta-forecast
      name: dsh-eta-forecast
