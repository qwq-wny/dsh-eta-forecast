name: Publish to npm

# Trusted publishing (OIDC): the runner exchanges its GitHub OIDC token for a
# short-lived npm publish credential, so there is no long-lived npm token in
# this repository, no 2FA code to type, and nothing to approve by hand.
#
# One-time setup on npmjs.com (see the notes in the PR/commit that added this
# file): package -> Settings -> Trusted publishing -> GitHub Actions, with
#   Organization or user: qwq-wny
#   Repository:           dsh-eta-forecast
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
# A brand-new trusted publisher configuration must complete its first
# successful publish within 2 days or it expires and has to be recreated.

on:
  push:
    tags:
      - 'v*'


permissions:
  id-token: write   # required: lets the job mint the OIDC token npm exchanges
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # never cache in a release build

      # Trusted publishing needs npm CLI >= 11.5.1; pin to latest rather than
      # rely on whatever the runner image happens to bundle.
      - run: npm install -g npm@latest

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $ver"
            exit 1
          fi

      - run: npm test

      - name: Publish (OIDC, no token)
        run: npm publish